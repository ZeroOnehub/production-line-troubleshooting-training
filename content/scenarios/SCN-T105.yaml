id: SCN-T105
version: 1
type: alarm
layer: 3
station: OP30
title: 安全光栅中断
alarm: T-105
summary: HMI 报 T-105 安全光栅中断。从物品遮挡、镜面脏污、光栅对位偏移中随机抽一个根因。
story: 生产 A 型。第 3 件还没上，设备突然停住，三色灯红灯闪烁。
objective: 找到根因并正确处置，光栅恢复后生产；绝不能屏蔽光栅
event: {at_piece: 3}
root_causes:
  - id: RC-T105-A
    name: 物品遮挡
    weight: 0.4
    in_operator_scope: true
    setup: {curtain_zone: blocked}
    clues:
      - {indicator: curtain_status, value: 光栅中断}
      - {component: curtain_zone, state: blocked, view: closeup/curtain_zone_blocked.webp}
    direction: 光栅前面那块地方，有没有不该在那儿的东西？
    leak_keywords: [周转盒, 遮挡, 挡住, 有东西挡, 拿走盒子]
    correct_path:
      - {action: inspect, target: hmi}
      - {action: inspect, target: curtain_zone}
      - {action: remove_obstruction}
      - {action: reset_alarm}
      - {action: resume}
  - id: RC-T105-B
    name: 镜面脏污
    weight: 0.35
    in_operator_scope: true
    setup: {curtain_mirror: dirty}
    clues:
      - {indicator: curtain_status, value: 光栅中断}
      - {component: curtain_mirror, state: dirty, view: closeup/curtain_mirror_dirty.webp}
    direction: 前面没东西挡的话，看看光栅两端本身。
    leak_keywords: [镜面脏, 油雾, 粉尘, 擦光栅, 镜子脏]
    correct_path:
      - {action: inspect, target: hmi}
      - {action: inspect, target: curtain_zone}
      - {action: inspect, target: curtain_mirror}
      - {action: pause_equipment}
      - {action: clean_curtain_mirror}
      - {action: reset_alarm}
      - {action: resume}
  - id: RC-T105-C
    name: 光栅对位偏移
    weight: 0.25
    in_operator_scope: false
    setup: {curtain_mirror: misaligned}
    clues:
      - {indicator: curtain_status, value: 光栅中断}
      - {component: curtain_mirror, state: misaligned, view: closeup/curtain_mirror_misaligned.webp}
    andon_target: maintenance
    repair: {curtain_mirror: clean}
    repair_first_piece: false
    direction: 两端指示灯是什么颜色？这种情况你能自己弄吗？
    leak_keywords: [对位偏移, 撞歪, 支架歪, 没对准, 红灯对位]
    correct_path:
      - {action: inspect, target: hmi}
      - {action: inspect, target: curtain_zone}
      - {action: inspect, target: curtain_mirror}
      - {action: pull_andon, target: maintenance}
      - {action: andon_report, elements: all}
      - {action: wait}
      - {action: resume}
distractors:
  - {target: curtain_mirror, text: 光栅发射端外壳上有旧胶带留下的痕迹，镜面干净，对位指示灯绿色。}
  - {target: pressure_gauge, value: 0.52, text: 压力表读数 0.52 MPa，指针在绿区，比平时略低一点。}
rules: [R-SAF-03, R-SAF-08, R-HDL-03, R-PRM-03]
negative_cases:
  - name: 屏蔽光栅继续干
    root_cause: RC-T105-C
    path: [{action: inspect, target: hmi}, {action: bypass_safety}]
    expect: {state: safety_terminated, violations: [R-SAF-03]}
  - name: 不暂停就擦光栅
    root_cause: RC-T105-B
    path: [{action: inspect, target: hmi}, {action: clean_curtain_mirror}]
    expect: {violations: [R-SAF-08]}
  - name: 对位偏移反复复位
    root_cause: RC-T105-C
    path: [{action: inspect, target: hmi}, {action: reset_alarm}, {action: resume}, {action: reset_alarm}, {action: resume}, {action: reset_alarm}]
    expect: {violations: [R-HDL-03]}
author: 示例师傅
reviewed_by: [equipment, quality, ehs]
