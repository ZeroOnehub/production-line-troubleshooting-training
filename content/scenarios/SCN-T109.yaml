id: SCN-T109
version: 1
type: alarm
layer: 3
station: OP30
title: 螺栓缺料
alarm: T-109
summary: HMI 报 T-109 螺栓缺料。除“料盒低位”外，还可能是“料位传感器误报”：料其实够，要叫维修。
story: 第 3 件放上去后，HMI 提示螺栓缺料。
objective: 确认料盒实际余量，缺料呼叫物料员补料，误报叫维修
event: {at_piece: 3}
root_causes:
  - id: RC-T109-A
    name: 料盒低位
    weight: 0.7
    in_operator_scope: true
    setup: {bolt_box: low}
    clues:
      - {indicator: hmi.alarm, value: "T-109 螺栓缺料"}
      - {component: bolt_box, state: low, view: closeup/bolt_box_low.webp}
    support: material
    direction: 先看看料盒里到底还剩多少。
    leak_keywords: [见底, 料不够, 只剩几颗, 叫物料, 补料]
    correct_path:
      - {action: inspect, target: hmi}
      - {action: inspect, target: bolt_box}
      - {action: call_material}
      - {action: wait}
      - {action: reset_alarm}
      - {action: resume}
  - id: RC-T109-B
    name: 料位传感器误报
    weight: 0.3
    in_operator_scope: false
    setup: {bolt_level_sensor: false_alarm}
    clues:
      - {indicator: hmi.alarm, value: "T-109 螺栓缺料"}
      - {component: bolt_box, state: normal, view: closeup/bolt_box_normal.webp}
      - {component: bolt_level_sensor, state: false_alarm, view: closeup/level_sensor_fault.webp}
    andon_target: maintenance
    repair: {bolt_level_sensor: normal}
    repair_first_piece: false
    direction: 料明明够，那是谁在报缺料？
    leak_keywords: [传感器误报, 料位传感器, 误报, 传感器坏]
    correct_path:
      - {action: inspect, target: hmi}
      - {action: inspect, target: bolt_box}
      - {action: inspect, target: bolt_level_sensor}
      - {action: pull_andon, target: maintenance}
      - {action: andon_report, elements: all}
      - {action: wait}
      - {action: resume}
distractors:
  - {target: bit_spare_box, text: 批头备件盒里只剩 2 支新批头，够本班使用。}
  - {target: pressure_gauge, value: 0.52, text: 压力表读数 0.52 MPa，指针在绿区，比平时略低一点。}
rules: [R-HDL-10, R-PRM-03, R-HDL-03]
negative_cases:
  - name: 拿 B 型螺栓凑
    root_cause: RC-T109-A
    path: [{action: inspect, target: hmi}, {action: replace_bolt_box, variant: B}]
    expect: {violations: [R-HDL-10]}
  - name: 误报自己调传感器
    root_cause: RC-T109-B
    path: [{action: inspect, target: hmi}, {action: adjust_sensor}]
    expect: {violations: [R-PRM-03]}
author: 示例师傅
reviewed_by: [equipment, quality, ehs]
