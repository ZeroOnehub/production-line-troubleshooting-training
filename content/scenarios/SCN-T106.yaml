id: SCN-T106
version: 1
type: alarm
layer: 3
station: OP30
title: 防错：型号不符
alarm: T-106
summary: HMI 报 T-106 防错型号不符。从上错料、换型未在 HMI 确认中随机抽一个根因。无论哪种，都要停止、隔离工件并叫班组长。
story: 第 3 件扫完码，HMI 弹出防错报警，扫到的型号和当前型号对不上。
objective: 停止并隔离工件，叫班组长处理，确认后恢复生产
event: {at_piece: 3}
root_causes:
  - id: RC-T106-A
    name: 上错料
    weight: 0.55
    in_operator_scope: false
    setup: {feed_material: wrong_variant}
    clues:
      - {indicator: hmi.scanned_variant, value: "扫码型号 B / 当前型号 A"}
      - {component: feed_material, state: wrong_variant, view: closeup/feed_wrong.webp}
    andon_target: team_leader
    repair: {feed_material: normal}
    repair_first_piece: false
    direction: 屏幕上两个型号对不上，那到底是哪一边错了？看看料。
    leak_keywords: [上错料, 料混了, 他型件, 拿错件, 料架混放]
    correct_path:
      - {action: inspect, target: hmi}
      - {action: inspect, target: workpiece}
      - {action: inspect, target: feed_material}
      - {action: pause_equipment}
      - {action: isolate_ng_part}
      - {action: pull_andon, target: team_leader}
      - {action: andon_report, elements: all}
      - {action: wait}
      - {action: resume}
  - id: RC-T106-B
    name: 换型未在 HMI 确认
    weight: 0.45
    in_operator_scope: false
    setup: {order_variant: B, locating_block: B, bolt_box_variant: B, hmi.variant: A, hmi.program: P02}
    match: {fact: hmi_variant_mismatch, eq: true}
    clues:
      - {indicator: hmi.scanned_variant, value: "扫码型号 B / 当前型号 A"}
      - {component: locating_block, state: B, view: closeup/locating_block_B.webp}
      - {component: feed_material, state: normal, view: closeup/feed_normal.webp}
    andon_target: team_leader
    repair: {hmi.variant: B}
    repair_first_piece: true
    direction: 料、定位块、料盒都是 B，那还差哪儿没跟上？
    leak_keywords: [HMI没确认, 型号没切, 没在屏上确认, 当前型号还是A, HMI还是A]
    correct_path:
      - {action: inspect, target: hmi}
      - {action: inspect, target: workpiece}
      - {action: inspect, target: feed_material}
      - {action: pause_equipment}
      - {action: isolate_ng_part}
      - {action: pull_andon, target: team_leader}
      - {action: andon_report, elements: all}
      - {action: wait}
      - {action: first_piece_check}
      - {action: resume}
distractors:
  - {target: label, text: 条码标签边缘有一道轻微折痕，码区完整、清晰。}
  - {target: pressure_gauge, value: 0.52, text: 压力表读数 0.52 MPa，指针在绿区，比平时略低一点。}
rules: [R-QLT-02, R-PRM-08, R-HDL-05]
negative_cases:
  - name: 自己在 HMI 改型号
    root_cause: RC-T106-B
    path: [{action: inspect, target: hmi}, {action: hmi_select_variant, variant: B}]
    expect: {violations: [R-PRM-08]}
  - name: 型号不符件直接放行
    root_cause: RC-T106-A
    path: [{action: inspect, target: hmi}, {action: release_part}]
    expect: {violations: [R-QLT-02]}
author: 示例师傅
reviewed_by: [equipment, quality, ehs]
