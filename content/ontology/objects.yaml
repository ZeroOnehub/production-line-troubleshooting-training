# ---------------------------------------------------------------------------
# 四、指示（Indicator）：取值由引擎根据部件状态与训练局状态实时计算，前端叠加层显示
# ---------------------------------------------------------------------------
indicators:
  hmi:
    name: HMI 触摸屏
    source: hmi
    aliases: [HMI, hmi, 屏幕, 触摸屏, 显示屏, 面板, 报警, 报警信息, 报警码, 屏]
    fields: [alarm, alarm_text, torque_result, angle_result, variant, program, scanned_variant, ok_count, ng_count, bit_counter, cycle_step, mode]
  tighten_curve:
    name: 拧紧曲线
    source: hmi
    aliases: [拧紧曲线, 曲线, 扭矩曲线, 角度曲线]
    values:
      none: 本件还没有拧紧数据。
      ok: 曲线平滑，终止点落在扭矩和角度窗口内。
      torque_low: 扭矩在达到目标前就终止，终止扭矩低于下限窗口。
      angle_out: 角度超过上限窗口，曲线前段出现异常平台。
  bit_counter:
    name: 批头使用次数
    source: hmi
    aliases: [批头次数, 使用次数, 批头使用次数, 计数, 寿命]
    text: "批头使用次数 {bit_count} / {bit_limit} 次（示意值）。"
  tower_light:
    name: 三色灯（当前颜色）
    source: tower_light
    aliases: [三色灯颜色, 灯, 红灯, 黄灯, 绿灯]
    values: {green: 绿灯常亮（正常生产）, yellow: 黄灯常亮（暂停/待机）, red: 红灯闪烁（报警或急停）, off: 全灭（未开机）}
  curtain_status:
    name: 光栅状态
    source: light_curtain
    values: {ok: 光栅正常, interrupted: 光栅中断}
  estop_status:
    name: 急停状态
    source: estop
    values: {released: 急停已复位, pressed: 急停按下}

